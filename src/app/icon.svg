<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Saturn favicon: the planet with its cyan ring -->
  <rect width="64" height="64" rx="14" fill="#050507"/>
  <!-- Planet -->
  <circle cx="32" cy="32" r="14" stroke="#ededf0" stroke-width="2.5"/>
  <!-- Orbit ring -->
  <ellipse cx="32" cy="32" rx="23" ry="9" transform="rotate(-18 32 32)"
           stroke="#00ffff" stroke-width="2.5"/>
</svg>
